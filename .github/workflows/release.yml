name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.8). Leave empty to use the latest commit.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Compile
        run: npm run compile

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit

      - name: Package extension
        run: npx vsce package --no-dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ollamaforge-${{ steps.version.outputs.version }}
          path: '*.vsix'
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ollama Forge v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: '*.vsix'

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCODE_PAT != '' }}
        run: npx vsce publish --no-dependencies
        env:
          VSCODE_PAT: ${{ secrets.VSCODE_PAT }}
