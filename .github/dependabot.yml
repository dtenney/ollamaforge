version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "typescript"
          - "mocha"
          - "sinon"
          - "@types/*"
          - "esbuild"
          - "@vscode/*"
          - "nyc"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # better-sqlite3 and tree-sitter ship native binaries (.node files
      # copied into dist/). All version bumps need manual testing to
      # confirm the rebuilt binary is compatible with the packaged extension.
      - dependency-name: "better-sqlite3"
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-typescript"
      - dependency-name: "tree-sitter-python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
