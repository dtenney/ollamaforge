<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Blade running top to bottom -->
  <line x1="12" y1="2.5" x2="12" y2="21.5"/>
  <!-- Top pommel/handle -->
  <rect x="10.5" y="2" width="3" height="1.8" rx="0.5" stroke-width="1.2"/>
  <!-- Hexagonal gem frame -->
  <polygon points="12,6.5 14.8,8.2 14.8,11.8 12,13.5 9.2,11.8 9.2,8.2" stroke-width="1.3"/>
  <!-- Inner gem diamond (cyan accent) -->
  <polygon points="12,8 13.5,10 12,12 10.5,10" stroke-width="0.8" stroke="#22d3ee" fill="#22d3ee" fill-opacity="0.5"/>
  <!-- Outer hex frame corners top -->
  <polyline points="8.5,5.2 7.2,6.5 7.2,8.5" stroke-width="1"/>
  <polyline points="15.5,5.2 16.8,6.5 16.8,8.5" stroke-width="1"/>
  <!-- Outer hex frame corners bottom -->
  <polyline points="7.2,11.5 7.2,13.5 8.5,14.8" stroke-width="1"/>
  <polyline points="16.8,11.5 16.8,13.5 15.5,14.8" stroke-width="1"/>
  <!-- Circuit traces left -->
  <polyline points="9.2,10 6.5,10 5.5,9" stroke-width="0.9"/>
  <line x1="5.5" y1="9" x2="4.5" y2="9"/>
  <circle cx="4.5" cy="9" r="0.7" fill="currentColor" stroke="none"/>
  <polyline points="9.2,11 7,11 6,12" stroke-width="0.8"/>
  <circle cx="6" cy="12" r="0.6" fill="currentColor" stroke="none"/>
  <!-- Circuit traces right -->
  <polyline points="14.8,10 17.5,10 18.5,9" stroke-width="0.9"/>
  <line x1="18.5" y1="9" x2="19.5" y2="9"/>
  <circle cx="19.5" cy="9" r="0.7" fill="currentColor" stroke="none"/>
  <polyline points="14.8,11 18,11 18,12" stroke-width="0.8"/>
  <circle cx="18" cy="12" r="0.6" fill="currentColor" stroke="none"/>
</svg>
